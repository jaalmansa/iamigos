# Publishes a release when a vX.Y.Z tag is pushed:
#   1. checks that the tag matches the version in package.json, and runs lint, type check and tests
#   2. builds the desktop app for macOS (arm64, x64) and Windows (x64, arm64)
#   3. creates the GitHub Release with the app zips and the GNOME extension zip
#   4. publishes the package to npm (public), last: `npx iamigos install` downloads
#      the app from the Release of its own version, so that Release must exist first
#
# Usage:  npm version patch   (bumps the version, commits and tags)
#         git push --follow-tags
#
# Needs the NPM_TOKEN secret (an "Automation" or "Granular" token allowed to publish).

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tag matches package.json
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but package.json says $pkg"
            exit 1
          fi

      - name: Lint, type check and tests
        run: |
          npm ci
          npm run check

  desktop:
    needs: check
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the app
        working-directory: desktop
        run: |
          npm ci
          npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}
          path: desktop/dist/*.zip

  release:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Package the extension
        run: |
          sudo apt-get install -y --no-install-recommends libglib2.0-bin >/dev/null
          glib-compile-schemas gnome-extension/iamigos@iamigos/schemas
          cd gnome-extension/iamigos@iamigos
          zip -r "../../dist/iamigos@iamigos.shell-extension.zip" . -x '*.tmp'

      - name: Create the GitHub Release
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
