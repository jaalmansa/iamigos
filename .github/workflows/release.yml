# Publishes a release when a vX.Y.Z tag is pushed:
#   1. checks that the tag matches the version in package.json
#   2. runs lint, type check and tests
#   3. publishes the package to npm (public)
#   4. creates the GitHub Release with the GNOME extension zip
#
# Usage:  npm version patch   (bumps the version, commits and tags)
#         git push --follow-tags
#
# Needs the NPM_TOKEN secret (an "Automation" or "Granular" token allowed to publish).

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Tag matches package.json
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but package.json says $pkg"
            exit 1
          fi

      - name: Lint, type check and tests
        run: |
          npm ci
          npm run check

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Package the extension
        run: |
          sudo apt-get install -y --no-install-recommends libglib2.0-bin >/dev/null
          glib-compile-schemas gnome-extension/iamigos@iamigos/schemas
          mkdir -p dist
          cd gnome-extension/iamigos@iamigos
          zip -r "../../dist/iamigos@iamigos.shell-extension.zip" . -x '*.tmp'

      - name: Create the GitHub Release
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
